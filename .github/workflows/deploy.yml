name: Deploy

on:
  push:
    branches: [main]

# 서버 준비가 끝나면 저장소 변수 DEPLOY_ENABLED를 true로 설정한다.
jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, jeenee, j-son]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          build-args: |
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
          tags: |
            ghcr.io/leju-june/j-sun-${{ matrix.app }}:latest
            ghcr.io/leju-june/j-sun-${{ matrix.app }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 서버 배포
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key "$TARGET" "mkdir -p ~/j-sun/infra"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$TARGET:~/j-sun/"
          scp -i ~/.ssh/deploy_key infra/Caddyfile "$TARGET:~/j-sun/infra/"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" "
            set -e
            cd ~/j-sun
            docker login ghcr.io -u '$GHCR_USER' --password-stdin
            docker compose -f docker-compose.prod.yml pull gateway jeenee j-son migrate-gateway migrate-jeenee migrate-j-son
            docker compose -f docker-compose.prod.yml run --rm migrate-gateway
            docker compose -f docker-compose.prod.yml run --rm migrate-jeenee
            docker compose -f docker-compose.prod.yml run --rm migrate-j-son
            docker compose -f docker-compose.prod.yml up -d
          "
