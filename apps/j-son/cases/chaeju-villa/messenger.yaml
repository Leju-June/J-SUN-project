# 메신저 대화. label은 플레이어가 보내는 질문, lines는 돌아오는 답이다.
- id: park
  chapter: prologue
  name: 박채주
  role: 채주빌라 집주인
  intro:
    - "아이고 [형사]님, 연락 기다렸어요. [박채주]예요, [채주빌라] [주인]."
    - "궁금한 건 뭐든 물어보세요. 내 [건물] 일은 내가 제일 잘 알아요."
  topics:
    - id: park-building
      label: "[건물]에 대해 알려 주십시오."
      lines:
        - "[채주빌라]는 [1998년]에 내가 직접 지어 올린 [건물]이에요. 내 [이름]을 따서 채주빌라."
        - "[1층]은 [주차장]이랑 [경비실], 그리고 내가 사는 [101호]. [2층]부터 [5층]까지는 한 [층]에 네 집씩, 모두 [열여섯 집]이에요."
        - "[엘리베이터]는 없고 [계단] 하나에 [현관]도 하나예요. 드나드는 길은 거기뿐이죠."
    - id: park-reports
      label: "[실종신고] 네 건을 차례로 말씀해 주십시오."
      lines:
        - "[작년 11월]에 [204호] [이든]이. 올해 [2월]에 [303호] [문가을] 씨."
        - "[6월]에 [402호] [남궁설] 씨. 그리고 [지난달]에 [503호] [하보람] 씨."
        - "하나같이 [짐]은 그대로 두고 [사람]만 없어졌어요. 그래서 다들 처음엔 금방 오겠거니 했죠."
    - id: park-204
      requires: [topic:park-reports]
      label: "[204호] [이든] 씨는 어떤 사람이었습니까?"
      lines:
        - "스물네 살, 착한 애였어요. [어머니] [세미] 씨랑 둘이 살면서 밤늦게 [편의점] 일을 했지."
        - "[작년 11월 11일] 밤에 나가서는 안 들어왔대요. 내가 [일주일]을 기다리다 못해 [신고]했어요."
    - id: park-204-why
      requires: [topic:park-204]
      label: "[가족]이 아니라 [사장님]이 [신고]하셨다고요?"
      lines:
        - "그러게 말이에요. [세미] 씨는 [아들]이 원래 며칠씩 안 들어온다면서 [신고]를 안 하더라고요."
        - "[월세] 받으러 올라갔다가 그 얘길 듣고 내가 대신 [경찰서]에 갔어요. [집주인]이 그 정도는 해야지."
    - id: park-303
      requires: [topic:park-reports]
      label: "[303호] [문가을] 씨는요?"
      lines:
        - "서른하나, 집에서 [그림] 그리는 [프리랜서]. 밤낮이 바뀌어서 옆집 [304호] [김사수] 씨랑 [소음]으로 자주 다퉜어요."
        - "[2월 17일] 밤 이후로 본 사람이 없어요. 옆집이 갑자기 조용해졌다고 [김사수] 씨가 [신고]했지. 그 양반은 원래 신고가 [취미]예요."
    - id: park-402
      requires: [topic:park-reports]
      label: "[402호] [남궁설] 씨는요?"
      lines:
        - "마흔다섯, [화물차] 모는 [기사]예요. 며칠씩 집을 비우는 사람이라 아무도 이상하게 안 봤죠."
        - "[6월 16일]에 [주차장]에 [차]를 대고 올라간 게 마지막이에요. 차가 [일주일]째 꼼짝을 안 하니까 [경비원] [강한석] 씨가 [신고]했어요."
    - id: park-503
      requires: [topic:park-reports]
      label: "[503호] [하보람] 씨는요?"
      lines:
        - "스물여덟, [병원]에서 일하는 [간호조무사]. 싹싹해서 내가 참 예뻐했는데."
        - "[10월 13일] 밤에 [야간 근무] 나간다고 인사한 게 마지막이었대요. 옆집 [504호] [오로라] 씨가 [신고]했어요. 그 사람이 남을 챙기는 건 처음 봤네."
    - id: park-tenants
      label: "[세입자] 중에 눈에 띄는 사람이 있습니까?"
      lines:
        - "[304호] [김사수] 씨는 까칠해요. [층간소음], [주차], [가로등]까지 [구청]에 넣은 [민원]만 수십 건이에요."
        - "[504호] [오로라] 씨는 조용하다 못해 음침해요. [월세]가 [석 달]째 밀렸는데 문을 두드려도 대답이 없어요."
        - "[204호] [세미] 씨는… [아들]이 없어지고도 [이사]를 안 가요. 묻는 말에도 통 대답을 안 하고."
    - id: park-guard
      label: "[경비원]은 어떤 분입니까?"
      lines:
        - "[강한석] 씨요? [2년] 전에 내가 뽑았어요. 말수는 적어도 일은 꼼꼼해요."
        - "[밤]에만 [근무]해요. [연락처]를 드릴 테니 직접 물어보세요. 지금은 잘 시간이라 답이 좀 늦을 거예요."
    - id: park-alibi
      requires: [topic:park-reports]
      label: "[실종]된 날 [밤], [사장님]은 어디 계셨습니까?"
      lines:
        - "어머, 나를 의심하는 거예요? 나야 늘 [101호]에 있죠. [밤 9시]면 자요."
        - "[건물]에서 [사람]이 자꾸 없어지면 제일 손해 보는 게 누군데요. [빈방]이 벌써 셋이에요, 셋."
    - id: park-cctv
      requires: [board:ask-guard]
      label: "[화요일] 밤마다 [CCTV] [녹화]가 끊긴 이유가 뭡니까?"
      lines:
        - "아이고, 그거 [야시장] 때문이에요. [화요일]마다 [전기]를 어찌나 끌어다 쓰는지 우리 [건물]까지 [정전]이 난다니까."
        - "[녹화기]가 그때 꺼졌다가 [자정]쯤 다시 켜져요. [경찰]한테도 몇 번을 설명했는데."
        - "…그런데 그 얘긴 누구한테 들었어요? [강한석] 씨가 그래요?"

- id: kang
  chapter: ch1
  name: 강한석
  role: 채주빌라 경비원
  intro:
    - "[강한석]입니다. [사장님]께 얘기 들었습니다."
    - "아는 대로 답하겠습니다. 길게는 못 씁니다."
  topics:
    - id: kang-shift
      label: "[근무] 시간을 알려 주십시오."
      lines:
        - "[저녁 6시]부터 다음 날 [아침 6시]까지 [경비실]을 지킵니다."
        - "[일주일]에 하루, [화요일]만 쉽니다. [사장님]이 정해 준 [휴무일]입니다."
    - id: kang-402
      label: "[402호] [남궁설] 씨는 직접 [신고]하셨죠?"
      lines:
        - "예. 남궁설 씨 [화물차]가 [주차장]에서 [일주일]을 그대로 서 있었습니다."
        - "[6월 16일] 밤에 들어온 게 마지막일 겁니다. 그날은 제가 [근무]를 서지 않아 직접 보진 못했습니다."
        - "다음 날 [저녁]에 [출근]해 보니 [차]가 평소와 다르게 비뚤게 대어 있었습니다. 그게 계속 마음에 걸렸습니다."
    - id: kang-cctv
      label: "[현관]에 [CCTV]가 있습니까?"
      lines:
        - "[현관]에 한 대 있습니다. [녹화기]는 [경비실] 안에 있고 [30일] 치가 남습니다."
        - "[실종신고] 때마다 [경찰]이 [영상]을 가져갔습니다. 특별한 건 안 나왔다고 들었습니다."
    - id: kang-tenants
      label: "[입주민]들은 어떻습니까?"
      lines:
        - "[304호] [김사수] 씨는 밤마다 [경비실]에 내려와 [민원]을 적고 갑니다. 누가 몇 시에 들어왔는지 저보다 잘 압니다."
        - "[504호] [오로라] 씨는 [새벽]에만 나갑니다. [인사]를 받아 준 적이 없습니다."
        - "[204호] [세미] 씨는 [아드님]이 없어진 뒤로 매일 밤 [현관] 앞에 한참 서 있다가 들어갑니다."
    - id: kang-owner
      label: "[박채주] 사장님은 어떤 분입니까?"
      lines:
        - "[월급]은 밀린 적 없습니다."
        - "다만 [건물] 일은 전부 본인이 쥐고 계십니다. [경비실] [열쇠]도 [사장님]과 저, 둘만 갖고 있습니다."
    - id: kang-keeper
      requires: [board:ask-guard]
      label: "[화요일] 밤에는 [녹화기]를 누가 관리합니까?"
      lines:
        - "제가 쉬는 날에는 [사장님]이 직접 [경비실] 문을 열고 닫습니다."
        - "[녹화기] [비밀번호]도 사장님이 정했습니다. 저는 [화면]만 볼 수 있습니다."
