# 서버의 같은 폴더에 infra/Caddyfile과 .env를 함께 둔다.
# .env: DOMAIN, POSTGRES_PASSWORD, ANTHROPIC_API_KEY, ADMIN_SECRET, DAILY_SPEND_LIMIT_USD
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - gateway
      - jeenee

  gateway:
    image: ghcr.io/leju-june/j-sun-gateway:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jsun:${POSTGRES_PASSWORD}@db:5432/jsun
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  jeenee:
    image: ghcr.io/leju-june/j-sun-jeenee:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://jsun:${POSTGRES_PASSWORD}@db:5432/jsun
      TRUST_PROXY: "1"
    # 외부 포트를 열지 않아야 Caddy만 X-Real-IP를 설정할 수 있다.
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  # 배포 때 `docker compose -f docker-compose.prod.yml run --rm migrate-gateway && ... run --rm migrate-jeenee`
  migrate-gateway:
    image: ghcr.io/leju-june/j-sun-gateway:latest
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://jsun:${POSTGRES_PASSWORD}@db:5432/jsun
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy

  migrate-jeenee:
    image: ghcr.io/leju-june/j-sun-jeenee:latest
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: postgres://jsun:${POSTGRES_PASSWORD}@db:5432/jsun
    command: sh -c "npm run db:migrate && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jsun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jsun
    volumes:
      - jsun-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsun"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  caddy-data:
  jsun-db:
