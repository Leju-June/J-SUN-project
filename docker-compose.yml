# 로컬 개발용 DB. 운영 구성은 docker-compose.prod.yml을 사용한다.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jeenee
      POSTGRES_PASSWORD: jeenee
      POSTGRES_DB: jeenee
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jeenee-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeenee"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  jeenee-db:
